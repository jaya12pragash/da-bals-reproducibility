name: Validate reproducibility package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Compile Python files
        run: python -m py_compile scripts/*.py

      - name: Validate simulation boundaries
        run: python scripts/validate_model_consistency.py

      - name: Validate extended evidence
        run: python scripts/validate_extended_claims.py

      - name: Regenerate figures
        run: |
          python scripts/generate_manuscript_figures.py
          python scripts/generate_architecture_figure_v2.py

      - name: Verify evidence integrity
        run: sha256sum -c SHA256SUMS
